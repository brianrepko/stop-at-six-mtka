name: publish-site

on:
  push:
    branches: main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Quarto extensions
        run: |
          quarto add jlgraves-ubc/forms --no-prompt

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'

      - name: Install dependencies
        run: |
          R -e "install.packages('ggplot2')"

      - name: Render site
        run: quarto render

      - name: Publish site
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
